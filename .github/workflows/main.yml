name: Update Legistar data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::httr
            any::dplyr
            any::readr

      - name: Update council members
        working-directory: code
        env:
          LEGISTAR_KEY: ${{ secrets.LEGISTAR_KEY }}
        run: Rscript update_legistar_appointments.R

      - name: Update legislative items
        if: always()
        working-directory: code
        env:
          LEGISTAR_KEY: ${{ secrets.LEGISTAR_KEY }}
        run: Rscript update_legistar_legislative_items.R

      - name: Commit results
        if: always()
        run: |
          git status --short
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/output/legistar/
          git commit -m 'Legistar data updated' || echo "No changes to commit"
          git push
